<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="blue-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="accent-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" fill="url(#bg-grad)" rx="20" />

  <!-- Subtle grid pattern -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="480" />
    <line x1="240" y1="0" x2="240" y2="480" />
    <line x1="400" y1="0" x2="400" y2="480" />
    <line x1="560" y1="0" x2="560" y2="480" />
    <line x1="720" y1="0" x2="720" y2="480" />
    <line x1="880" y1="0" x2="880" y2="480" />
    <line x1="0" y1="80" x2="960" y2="80" />
    <line x1="0" y1="160" x2="960" y2="160" />
    <line x1="0" y1="240" x2="960" y2="240" />
    <line x1="0" y1="320" x2="960" y2="320" />
    <line x1="0" y1="400" x2="960" y2="400" />
  </g>

  <!-- Title Header -->
  <text x="480" y="45" fill="#f8fafc" font-family="Inter, sans-serif" font-size="22" font-weight="700" text-anchor="middle">TabMate Architecture Overview</text>
  <text x="480" y="70" fill="#94a3b8" font-family="Inter, sans-serif" font-size="13" text-anchor="middle">Standalone Telegram Bot, Mini App &amp; Debt Simplification Engine</text>

  <!-- Box 1: Telegram Client -->
  <g filter="url(#shadow)">
    <rect x="50" y="110" width="220" height="280" rx="16" fill="url(#blue-card)" stroke="#334155" stroke-width="1.5" />
    <rect x="65" y="125" width="40" height="40" rx="10" fill="url(#accent-blue)" />
    <path d="M77 145 L93 133 L83 151 L87 146 Z" fill="#ffffff" />
    <text x="115" y="142" fill="#ffffff" font-family="Inter, sans-serif" font-size="16" font-weight="600">Telegram Client</text>
    <text x="115" y="158" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">Group &amp; DM chats</text>

    <!-- Sub items -->
    <rect x="65" y="185" width="190" height="50" rx="10" fill="#0f172a" stroke="#1e293b" />
    <text x="78" y="206" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="12" font-weight="600">Bot Commands</text>
    <text x="78" y="222" fill="#64748b" font-family="Inter, sans-serif" font-size="11">/split, /balance, /settle</text>

    <rect x="65" y="245" width="190" height="50" rx="10" fill="#0f172a" stroke="#1e293b" />
    <text x="78" y="266" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="12" font-weight="600">Telegram WebApp</text>
    <text x="78" y="282" fill="#64748b" font-family="Inter, sans-serif" font-size="11">Embedded React Viewport</text>

    <rect x="65" y="305" width="190" height="50" rx="10" fill="#0f172a" stroke="#1e293b" />
    <text x="78" y="326" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="12" font-weight="600">Haptic Feedback</text>
    <text x="78" y="342" fill="#64748b" font-family="Inter, sans-serif" font-size="11">Vibration &amp; Theme sync</text>
  </g>

  <!-- Box 2: Node.js Backend Server -->
  <g filter="url(#shadow)">
    <rect x="370" y="110" width="220" height="280" rx="16" fill="url(#blue-card)" stroke="#334155" stroke-width="1.5" />
    <rect x="385" y="125" width="40" height="40" rx="10" fill="url(#accent-emerald)" />
    <circle cx="405" cy="145" r="8" fill="#ffffff" />
    <text x="435" y="142" fill="#ffffff" font-family="Inter, sans-serif" font-size="16" font-weight="600">Fastify Server</text>
    <text x="435" y="158" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">Port 8080 / Node.js</text>

    <!-- Sub items -->
    <rect x="385" y="185" width="190" height="50" rx="10" fill="#0f172a" stroke="#1e293b" />
    <text x="398" y="206" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="12" font-weight="600">grammY Runner</text>
    <text x="398" y="222" fill="#64748b" font-family="Inter, sans-serif" font-size="11">Long Polling (No Webhook)</text>

    <rect x="385" y="245" width="190" height="50" rx="10" fill="#0f172a" stroke="#1e293b" />
    <text x="398" y="266" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="12" font-weight="600">Min Cash Flow Engine</text>
    <text x="398" y="282" fill="#64748b" font-family="Inter, sans-serif" font-size="11">Greedy Debt Reduction</text>

    <rect x="385" y="305" width="190" height="50" rx="10" fill="#0f172a" stroke="#1e293b" />
    <text x="398" y="326" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="12" font-weight="600">Native SQLite (WAL)</text>
    <text x="398" y="342" fill="#64748b" font-family="Inter, sans-serif" font-size="11">Zero C++ build dependencies</text>
  </g>

  <!-- Box 3: Settlements & Payments -->
  <g filter="url(#shadow)">
    <rect x="690" y="110" width="220" height="280" rx="16" fill="url(#blue-card)" stroke="#334155" stroke-width="1.5" />
    <rect x="705" y="125" width="40" height="40" rx="10" fill="url(#accent-purple)" />
    <path d="M720 145 L730 135 L730 155 Z" fill="#ffffff" />
    <text x="755" y="142" fill="#ffffff" font-family="Inter, sans-serif" font-size="16" font-weight="600">Settlements</text>
    <text x="755" y="158" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">1-Tap Direct Payments</text>

    <!-- Sub items -->
    <rect x="705" y="185" width="190" height="50" rx="10" fill="#0f172a" stroke="#1e293b" />
    <text x="718" y="206" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="12" font-weight="600">Revolut Deep Links</text>
    <text x="718" y="222" fill="#64748b" font-family="Inter, sans-serif" font-size="11">revolut.me/&lt;user&gt;</text>

    <rect x="705" y="245" width="190" height="50" rx="10" fill="#0f172a" stroke="#1e293b" />
    <text x="718" y="266" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="12" font-weight="600">PayPal &amp; Monzo</text>
    <text x="718" y="282" fill="#64748b" font-family="Inter, sans-serif" font-size="11">paypal.me / monzo.me</text>

    <rect x="705" y="305" width="190" height="50" rx="10" fill="#0f172a" stroke="#1e293b" />
    <text x="718" y="326" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="12" font-weight="600">Bank IBAN Transfer</text>
    <text x="718" y="342" fill="#64748b" font-family="Inter, sans-serif" font-size="11">One-click copy to clipboard</text>
  </g>

  <!-- Connecting Arrows -->
  <g stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.8">
    <!-- 1 to 2 -->
    <path d="M 270 210 L 370 210" marker-end="url(#arrow)" />
    <path d="M 370 270 L 270 270" stroke="#34d399" />

    <!-- 2 to 3 -->
    <path d="M 590 270 L 690 270" stroke="#c084fc" />
  </g>

  <!-- Labels on arrows -->
  <text x="320" y="202" fill="#38bdf8" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Long Polling</text>
  <text x="320" y="262" fill="#34d399" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">REST / SPA</text>
  <text x="640" y="262" fill="#c084fc" font-family="Inter, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Deep Links</text>

  <!-- Footer Info -->
  <text x="480" y="440" fill="#64748b" font-family="Inter, sans-serif" font-size="12" text-anchor="middle">Self-contained architecture with zero external domain or paid infrastructure requirements.</text>
</svg>
